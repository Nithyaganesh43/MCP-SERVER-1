# Render Infrastructure-as-Code blueprint
# https://docs.render.com/infrastructure-as-code
services:
  - type: web
    name: rytham-api
    runtime: node
    plan: free
    buildCommand: cd backend && npm ci && npm run build
    startCommand: cd backend && node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MCP_API_KEY
        sync: false
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: https://rytham-mcp.onrender.com/api/google/callback
      - key: CORS_ORIGINS
        value: https://rytham-mcp.onrender.com
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_URL
        value: https://api.deepseek.com/chat/completions
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: DEEPSEEK_TOKEN_BUDGET
        value: "100000"
